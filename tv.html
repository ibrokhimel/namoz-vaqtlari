<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namoz Vaqtlari — TV</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div class="stage" id="stage">

<div class="bg"></div>
<div class="geo"></div>
<div class="stars" id="stars"></div>
<div class="bar top"></div><div class="bar bot"></div>
<div class="sline l"></div><div class="sline r"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="layout">

  <!-- HEADER -->
  <header class="header">
    <div class="mosque-block">
      <div class="mosque-arabic" id="mosqueArabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
      <div class="mosque-name"   id="mosqueName">Namoz Vaqtlari</div>
    </div>
    <div class="clock-block">
      <div class="live-clock" id="liveClock">00:00:00</div>
      <div class="live-date"  id="liveDate">—</div>
    </div>
    <div class="next-block">
      <div class="next-lbl"><span class="ndot"></span>Keyingi namoz</div>
      <div class="next-nm" id="nextName">—</div>
      <div class="next-cd" id="nextCountdown">--:--:--</div>
      <div class="next-sub">qoldi</div>
    </div>
  </header>

  <!-- PANELS -->
  <div class="panels" id="panels">

    <!-- PANEL 1: Bugun + Ertaga -->
    <div class="panel panel-days visible" id="panel1">
      <!-- BUGUN -->
      <div class="day-section today">
        <div class="day-label-row">
          <div class="day-badge today"><span class="dbullet"></span>Bugun</div>
          <div class="day-date-txt" id="todayDate">—</div>
          <div class="sun-strip" id="todaySun"></div>
        </div>
        <div class="cards-row" id="todayCards"></div>
      </div>
      <!-- DIVIDER -->
      <div class="divider"></div>
      <!-- ERTAGA -->
      <div class="day-section tomorrow">
        <div class="day-label-row">
          <div class="day-badge tomorrow"><span class="dbullet"></span>Ertaga</div>
          <div class="day-date-txt" id="tomorrowDate">—</div>
          <div class="sun-strip" id="tomorrowSun"></div>
        </div>
        <div class="cards-row" id="tomorrowCards"></div>
      </div>
    </div>

    <!-- PANEL 2: Doira diagramma -->
    <div class="panel panel-circle" id="panel2">
      <div class="moon-corner" id="moonCorner">
        <svg id="moonSvg2" width="80" height="80" viewBox="0 0 80 80"></svg>
        <div class="moon-corner-label" id="moonCornerLabel">—</div>
      </div>
      <div class="circle-wrap">
        <canvas id="clockCanvas" width="580" height="580"></canvas>
        <div class="circle-center">
          <div class="cc-time"  id="ccTime">--:--</div>
          <div class="cc-label">hozirgi vaqt</div>
          <div class="cc-name"  id="ccName">—</div>
          <div class="cc-ar"   id="ccAr">—</div>
        </div>
      </div>
      <div class="circle-legend" id="circleLegend"></div>
    </div>

    <!-- Page dots -->
    <div class="page-dots">
      <div class="pdot on"  id="dot1" onclick="switchPanel(0)"></div>
      <div class="pdot"     id="dot2" onclick="switchPanel(1)"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div>
      <span id="cityFooter">Toshkent</span>
      <span class="f-sep"></span>
      <span id="methodFooter">—</span>
      <span class="f-sep"></span>
      UTC+5
    </div>
    <div class="f-center">❧ &nbsp; الله أكبر &nbsp; ❧ &nbsp; <span style="font-family:sans-serif;font-size:.75rem;letter-spacing:4px;opacity:.5">RKE</span></div>
    <div>Taqribiy astronomik hisob</div>
  </footer>

</div>

</div><!-- /stage -->

<script>
// ── FIT STAGE TO SCREEN ──────────────────────
(function(){
  const stage=document.getElementById('stage');
  function fitStage(){
    const s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.setProperty('--s', s);
  }
  fitStage();
  window.addEventListener('resize', fitStage);
})();
</script>
<script src="core.js"></script>
<script src="tv.js"></script>
</body>
</html>
