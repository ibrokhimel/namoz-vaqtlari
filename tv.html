<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namoz Vaqtlari — TV</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   55" TV — 1920x1080  ·  BUGUN + ERTAGA
   Islomiy klassik · Oltin & Ko'k · Masjid uslubi
═══════════════════════════════════════════════════════ */
:root {
  --bg:       #04080f;
  --gold:     #c9a84c;
  --gold-lt:  #f0d484;
  --gold-dim: rgba(201,168,76,0.16);
  --gold-gl:  rgba(201,168,76,0.35);
  --teal:     #2dd4bf;
  --text:     #e8dcc8;
  --soft:     #7a8899;
  --card:     rgba(12,20,38,0.88);
  --border:   rgba(201,168,76,0.2);
  --bsoft:    rgba(255,255,255,0.05);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--bg);font-family:'Tajawal',sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;
}

/* STAGE: the design is authored on a fixed 1920x1080 canvas and scaled
   to fit any screen (Android TV WebViews often report 960x540 @2x).
   fitStage() sets --s; the transform also makes .stage the containing
   block for the position:fixed decoration layers below. */
.stage{
  position:absolute;left:50%;top:50%;
  width:1920px;height:1080px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));
  background:var(--bg);
}

/* BACKGROUND */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 70% at 10% 50%,#0c1c38 0%,transparent 60%),
    radial-gradient(ellipse 60% 70% at 90% 50%,#09162c 0%,transparent 60%),
    radial-gradient(ellipse 100% 45% at 50% 0%, #0f1e34 0%,transparent 55%),
    var(--bg);
}
.geo{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,  transparent,transparent 79px,rgba(201,168,76,.032) 80px),
    repeating-linear-gradient(90deg, transparent,transparent 79px,rgba(201,168,76,.032) 80px);
}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle var(--d,2s) ease-in-out infinite alternate;
  animation-delay:var(--dl,0s);
}
@keyframes twinkle{
  from{opacity:.06;transform:scale(.8)}
  to  {opacity:.8;transform:scale(1.3)}
}
.bar{position:fixed;left:0;right:0;z-index:2;height:4px;
  background:linear-gradient(90deg,transparent,var(--gold),#f0d484,var(--gold),transparent)}
.bar.top{top:0}.bar.bot{bottom:0}
.sline{position:fixed;top:36px;bottom:36px;z-index:2;width:1px;
  background:linear-gradient(to bottom,transparent,var(--gold-gl) 25%,var(--gold-gl) 75%,transparent)}
.sline.l{left:56px}.sline.r{right:56px}
.corner{position:fixed;z-index:2;pointer-events:none}
.corner::before,.corner::after{content:'';position:absolute;background:var(--gold);opacity:.42}
.corner.tl{top:14px;left:14px}.corner.tr{top:14px;right:14px}
.corner.bl{bottom:14px;left:14px}.corner.br{bottom:14px;right:14px}
.corner::before{width:44px;height:2px}
.corner::after{width:2px;height:44px}
.corner.tl::before,.corner.bl::before{left:0}
.corner.tr::before,.corner.br::before{right:0}
.corner.tl::after,.corner.tr::after{top:0}
.corner.bl::after,.corner.br::after{bottom:0}
.corner.tl::before{top:0}.corner.tr::before{top:0}
.corner.bl::before{bottom:0}.corner.br::before{bottom:0}

/* LAYOUT */
.layout{
  position:relative;z-index:3;
  width:1920px;height:1080px;
  display:grid;
  grid-template-rows:128px minmax(0,1fr) 40px;
  /* TV overscan-safe area: 5% of each edge (Android TV: 48dp x 27dp) */
  padding:54px 96px;
}

/* PANELS WRAPPER */
.panels{position:relative;overflow:hidden;width:100%;height:100%}

/* Each panel sits on top of each other, transitions with opacity */
.panel{
  position:absolute;inset:0;
  opacity:0;
  transition:opacity .9s ease;
  pointer-events:none;
}
.panel.visible{opacity:1;pointer-events:all}

/* PANEL 1: two day rows */
.panel-days{
  display:grid;
  grid-template-rows:1fr 6px 1fr;
  gap:0;
  height:100%;
}


/* HEADER */
.header{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  animation:fadeDown .8s ease both;
}
.mosque-block{display:flex;flex-direction:column;gap:3px;min-width:460px}
.mosque-arabic{
  font-family:'Scheherazade New','Amiri',serif;
  font-size:2rem;color:var(--gold-lt);line-height:1;
  text-shadow:0 0 22px rgba(201,168,76,.5);
}
.mosque-name{font-size:1.15rem;font-weight:500;color:var(--text);letter-spacing:2px}
.clock-block{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.live-clock{
  font-family:'Amiri',serif;font-size:4.8rem;font-weight:700;
  color:var(--gold-lt);letter-spacing:4px;line-height:1;
  animation:clockGlow 2s ease-in-out infinite alternate;
}
@keyframes clockGlow{
  from{text-shadow:0 0 28px rgba(201,168,76,.4),0 0 56px rgba(201,168,76,.15)}
  to  {text-shadow:0 0 48px rgba(201,168,76,.7),0 0 96px rgba(201,168,76,.28)}
}
.live-date{font-size:.9rem;color:var(--soft);letter-spacing:4px;text-transform:uppercase;font-weight:300}
.next-block{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:360px}
.next-lbl{font-size:.68rem;letter-spacing:5px;text-transform:uppercase;color:var(--teal);
  display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 8px var(--teal);animation:blink 1s step-start infinite}
@keyframes blink{50%{opacity:0}}
.next-nm{font-size:1.35rem;font-weight:700;color:var(--gold-lt)}
.next-cd{
  font-family:'Amiri',serif;font-size:2.5rem;color:var(--teal);
  text-shadow:0 0 18px rgba(45,212,191,.45);letter-spacing:2px;line-height:1;
}
.next-sub{font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--soft)}

/* DAY SECTION */
.day-section{display:flex;flex-direction:column;padding:8px 0 6px}
.day-label-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;justify-content:space-between}
.day-badge{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:700;letter-spacing:6px;text-transform:uppercase}
.day-badge.today{color:var(--gold-lt);text-shadow:0 0 16px rgba(201,168,76,.45)}.day-badge.tomorrow{color:var(--soft)}
.dbullet{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold-gl)}
.day-badge.tomorrow .dbullet{background:var(--soft);box-shadow:none}
.day-date-txt{font-size:.88rem;color:var(--soft);letter-spacing:3px;margin-left:12px}
.sun-strip{font-size:.78rem;color:var(--soft);letter-spacing:2px;opacity:.65}
.sun-strip span{color:#f8c56a}

/* CARDS ROW */
.cards-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;flex:1}

/* BASE CARD */
.pcard{
  background:var(--card);border:1px solid var(--bsoft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;position:relative;overflow:hidden;
  transition:all .35s ease;cursor:default;
  animation:riseUp .7s var(--dl,0s) ease both;
}
@keyframes riseUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.pcard::before{
  content:'';position:absolute;top:0;left:15%;right:15%;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  transform:scaleX(0);transition:transform .35s ease;
}

/* TODAY cards */
.today .pcard{padding:16px 14px 20px;border-radius:20px}
.today .pcard .c-icon{font-size:1.9rem}
.today .pcard .c-ar{font-family:'Scheherazade New','Amiri',serif;font-size:1.75rem;color:var(--gold-lt);line-height:1}
.today .pcard .c-uz{font-size:.75rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--soft)}
.today .pcard .c-time{font-family:'Amiri',serif;font-size:3.5rem;font-weight:700;color:var(--text);line-height:1;letter-spacing:1px}
.today .pcard .c-adj{font-size:.65rem;color:var(--teal);letter-spacing:1px}
.today .pcard.active{
  background:linear-gradient(150deg,rgba(201,168,76,.15),rgba(8,22,50,.95));
  border-color:rgba(201,168,76,.55);
  box-shadow:0 0 0 1px rgba(201,168,76,.28),0 6px 48px rgba(201,168,76,.22);
  transform:translateY(-4px) scale(1.02);
}
.today .pcard.active::before{transform:scaleX(1)}
.today .pcard.active .c-ar{color:var(--gold-lt)}
.today .pcard.active .c-time{color:var(--gold-lt);text-shadow:0 0 22px rgba(201,168,76,.55)}
.today .pcard.passed{opacity:.25}

/* TOMORROW cards */
.tomorrow .pcard{padding:10px 12px 14px;border-radius:16px}
.tomorrow .pcard .c-icon{font-size:1.25rem}
.tomorrow .pcard .c-ar{font-family:'Scheherazade New','Amiri',serif;font-size:1.25rem;color:rgba(201,168,76,.55);line-height:1}
.tomorrow .pcard .c-uz{font-size:.6rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--soft);opacity:.6}
.tomorrow .pcard .c-time{font-family:'Amiri',serif;font-size:2.2rem;font-weight:700;color:rgba(232,220,200,.55);line-height:1}
.tomorrow .pcard .c-adj{font-size:.58rem;color:var(--teal);opacity:.65}

/* Active ribbon */
.pcard.next-prayer{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.06)}
.hijri-moon-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.hijri-month-name{font-family:'Amiri',serif;font-size:1rem;color:var(--gold-lt);letter-spacing:1px}
.moon-corner{
  position:absolute;top:18px;left:18px;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(10,15,30,0.6);border:1px solid rgba(201,168,76,0.2);
  border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px);
}
.moon-corner-label{
  font-family:'Amiri',serif;font-size:.85rem;color:var(--gold-lt);
  letter-spacing:1px;text-align:center;line-height:1.4;
}
.next-ribbon{background:linear-gradient(90deg,transparent,rgba(201,168,76,.15),transparent);color:var(--gold-lt)!important;letter-spacing:3px}
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.2),transparent);
  border-top:1px solid rgba(201,168,76,.25);
  text-align:center;padding:4px;
  font-size:.58rem;letter-spacing:5px;text-transform:uppercase;
  color:var(--gold);font-weight:700;
}

/* DIVIDER */
.divider{
  background:linear-gradient(90deg,transparent,var(--gold-gl) 20%,var(--gold-gl) 80%,transparent);
  border-radius:4px;align-self:center;
}

/* FOOTER */
.footer{
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--border);
  font-size:.75rem;color:var(--soft);letter-spacing:2px;
}
.f-sep{width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.4;display:inline-block;margin:0 10px;vertical-align:middle}
.f-center{font-family:'Amiri',serif;font-size:1.2rem;color:rgba(201,168,76,.32);letter-spacing:8px}

/* ── PANEL 2: CIRCLE DIAGRAM ── */
.panel-circle{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:80px;
  width:100%;
  height:100%;
}

.circle-wrap{
  position:relative;
  width:580px;height:580px;
  flex-shrink:0;
}

.circle-wrap canvas{position:absolute;top:0;left:0;width:580px;height:580px}

/* Center info */
.circle-center{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.cc-time{
  font-family:'Amiri',serif;font-size:3.2rem;font-weight:700;
  color:var(--gold-lt);text-shadow:0 0 20px rgba(201,168,76,.5);
  line-height:1;
}
.cc-label{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--soft);margin-top:4px}
.cc-name{font-size:1.1rem;font-weight:700;color:var(--text);margin-top:6px}
.cc-ar{font-family:'Scheherazade New','Amiri',serif;font-size:1.6rem;color:var(--gold-lt);line-height:1}

/* Legend */
.circle-legend{
  display:flex;flex-direction:column;justify-content:center;gap:16px;
  min-width:380px;
}
.legend-item{
  display:flex;align-items:center;gap:18px;
  padding:11px 20px;
  border-radius:14px;
  border:1px solid transparent;
  transition:all .3s ease;
  animation:fadeDown .6s var(--dl,0s) ease both;
}
.legend-item.active-leg{
  background:rgba(201,168,76,.1);
  border-color:rgba(201,168,76,.35);
  box-shadow:0 0 20px rgba(201,168,76,.12);
}
.legend-item.zuho-item{
  border:1px dashed rgba(212,160,32,.2);
  background:transparent;
  margin:2px 0;
}
.legend-item.zuho-item.active-leg{
  border:1px dashed rgba(212,160,32,.5);
  background:rgba(212,160,32,.08);
}
.legend-item.zuho-item .leg-name{color:rgba(232,213,160,.6)}
.legend-item.zuho-item.active-leg .leg-name{color:#e8d5a0}
.legend-item.zuho-item .leg-dot{border-radius:4px}
.leg-dot{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 8px var(--dc,#fff);
}
.leg-info{flex:1}
.leg-name{font-size:.95rem;font-weight:600;color:var(--text);letter-spacing:1px}
.leg-ar{font-family:'Scheherazade New','Amiri',serif;font-size:1.1rem;color:var(--soft)}
.leg-time{
  font-family:'Amiri',serif;font-size:1.8rem;font-weight:700;
  color:var(--text);letter-spacing:1px;
}
.legend-item.active-leg .leg-time{color:var(--gold-lt);text-shadow:0 0 12px rgba(201,168,76,.4)}
.legend-item.active-leg .leg-name{color:var(--gold-lt)}

/* Page indicator dots */
.page-dots{
  display:flex;align-items:center;justify-content:center;gap:10px;
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  z-index:10;
}
.pdot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(201,168,76,.25);border:1px solid rgba(201,168,76,.4);
  transition:all .4s ease;cursor:pointer;
}
.pdot.on{background:var(--gold);box-shadow:0 0 8px var(--gold-gl);transform:scale(1.3)}

/* ── DURATION LIST ── */
.circle-right{
  display:flex;flex-direction:column;gap:16px;
  min-width:420px;justify-content:center;
}
.dur-title{
  font-size:.7rem;letter-spacing:5px;text-transform:uppercase;
  color:var(--soft);border-bottom:1px solid var(--border);
  padding-bottom:8px;margin-bottom:4px;
}
.dur-item{
  display:flex;align-items:center;gap:12px;
  padding:8px 14px;border-radius:12px;
  border:1px solid transparent;
  transition:all .3s ease;
}
.dur-item.active-dur{
  background:rgba(201,168,76,.1);
  border-color:rgba(201,168,76,.3);
}
.dur-item.makruh-dur{
  background:rgba(192,57,43,.07);
  border-color:rgba(192,57,43,.2);
}
.dur-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dur-dot.sq{border-radius:3px}
.dur-name{font-size:.85rem;font-weight:600;color:var(--text);min-width:90px}
.dur-item.active-dur .dur-name{color:var(--gold-lt)}
.dur-range{font-size:.72rem;color:var(--soft);min-width:110px;letter-spacing:1px}
.dur-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.dur-bar{height:100%;border-radius:3px;transition:width .5s ease}
.dur-mins{font-family:'Amiri',serif;font-size:1.2rem;font-weight:700;color:var(--text);min-width:52px;text-align:right}
.dur-item.active-dur .dur-mins{color:var(--gold-lt)}
.dur-item.makruh-dur .dur-name{color:#e07070}
.dur-item.makruh-dur .dur-mins{color:#e07070}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="stage" id="stage">

<div class="bg"></div>
<div class="geo"></div>
<div class="stars" id="stars"></div>
<div class="bar top"></div><div class="bar bot"></div>
<div class="sline l"></div><div class="sline r"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="layout">

  <!-- HEADER -->
  <header class="header">
    <div class="mosque-block">
      <div class="mosque-arabic" id="mosqueArabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
      <div class="mosque-name"   id="mosqueName">Namoz Vaqtlari</div>
    </div>
    <div class="clock-block">
      <div class="live-clock" id="liveClock">00:00:00</div>
      <div class="live-date"  id="liveDate">—</div>
    </div>
    <div class="next-block">
      <div class="next-lbl"><span class="ndot"></span>Keyingi namoz</div>
      <div class="next-nm" id="nextName">—</div>
      <div class="next-cd" id="nextCountdown">--:--:--</div>
      <div class="next-sub">qoldi</div>
    </div>
  </header>

  <!-- PANELS -->
  <div class="panels" id="panels">

    <!-- PANEL 1: Bugun + Ertaga -->
    <div class="panel panel-days visible" id="panel1">
      <!-- BUGUN -->
      <div class="day-section today">
        <div class="day-label-row">
          <div class="day-badge today"><span class="dbullet"></span>Bugun</div>
          <div class="day-date-txt" id="todayDate">—</div>
          <div class="sun-strip" id="todaySun"></div>
        </div>
        <div class="cards-row" id="todayCards"></div>
      </div>
      <!-- DIVIDER -->
      <div class="divider"></div>
      <!-- ERTAGA -->
      <div class="day-section tomorrow">
        <div class="day-label-row">
          <div class="day-badge tomorrow"><span class="dbullet"></span>Ertaga</div>
          <div class="day-date-txt" id="tomorrowDate">—</div>
          <div class="sun-strip" id="tomorrowSun"></div>
        </div>
        <div class="cards-row" id="tomorrowCards"></div>
      </div>
    </div>

    <!-- PANEL 2: Doira diagramma -->
    <div class="panel panel-circle" id="panel2">
      <div class="moon-corner" id="moonCorner">
        <svg id="moonSvg2" width="80" height="80" viewBox="0 0 80 80"></svg>
        <div class="moon-corner-label" id="moonCornerLabel">—</div>
      </div>
      <div class="circle-wrap">
        <canvas id="clockCanvas" width="580" height="580"></canvas>
        <div class="circle-center">
          <div class="cc-time"  id="ccTime">--:--</div>
          <div class="cc-label">hozirgi vaqt</div>
          <div class="cc-name"  id="ccName">—</div>
          <div class="cc-ar"   id="ccAr">—</div>
        </div>
      </div>
      <div class="circle-legend" id="circleLegend"></div>
    </div>

    <!-- Page dots -->
    <div class="page-dots">
      <div class="pdot on"  id="dot1" onclick="switchPanel(0)"></div>
      <div class="pdot"     id="dot2" onclick="switchPanel(1)"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div>
      <span id="cityFooter">Toshkent</span>
      <span class="f-sep"></span>
      <span id="methodFooter">—</span>
      <span class="f-sep"></span>
      UTC+5
    </div>
    <div class="f-center">❧ &nbsp; الله أكبر &nbsp; ❧ &nbsp; <span style="font-family:sans-serif;font-size:.75rem;letter-spacing:4px;opacity:.5">RKE</span></div>
    <div>Taqribiy astronomik hisob</div>
  </footer>

</div>

</div><!-- /stage -->

<script>
// ── FIT STAGE TO SCREEN ──────────────────────
(function(){
  const stage=document.getElementById('stage');
  function fitStage(){
    const s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.setProperty('--s', s);
  }
  fitStage();
  window.addEventListener('resize', fitStage);
})();
</script>
<script>
/* ─────────────────────────────────────────── */
/*  PRAYER TIMES APP — app.js                  */
/* ─────────────────────────────────────────── */

// ──────────────────────────────────────────────
// CONSTANTS
// ──────────────────────────────────────────────
const PRAYERS = [
  { key: 'fajr',    nameUz: 'Bomdod',  nameAr: 'الفجر',  icon: '🌙' },
  { key: 'dhuhr',   nameUz: 'Peshin',  nameAr: 'الظهر',  icon: '☀️' },

// ──────────────────────────────────────────────
// MATH HELPERS
// ──────────────────────────────────────────────
const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;

function julianDay(date) {
  let y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  if (m <= 2) { y--; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}

function sunPosition(date) {
  const JD = julianDay(date);
  const D  = JD - 2451545.0;
  const g  = toRad(((357.529 + 0.98560028 * D) % 360 + 360) % 360);
  const q  = ((280.459 + 0.98564736 * D) % 360 + 360) % 360;
  const L  = toRad(((q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360 + 360) % 360);
  const e  = toRad(23.439 - 0.0000004 * D);
  const RA = toDeg(Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L))) / 15;
  const sinDec = Math.sin(e) * Math.sin(L);
  const cosDec = Math.cos(Math.asin(sinDec));
  const EqT    = q / 15 - ((RA + 24) % 24);
  return { sinDec, cosDec, EqT };
}

function calcPrayerTimes(date, lat, lon, methodKey, asrKey) {
  const method = METHODS[methodKey] || METHODS.Karachi;
  const asr    = ASR_METHODS[asrKey] || ASR_METHODS.Hanafi;
  const tz     = 5; // UTC+5 for Uzbekistan
  const { sinDec, cosDec, EqT } = sunPosition(date);

  const transit = 12 + tz - lon / 15 - EqT;

  function ha(angle) {
    const num = Math.sin(toRad(angle)) - Math.sin(toRad(lat)) * sinDec;
    const den = Math.cos(toRad(lat)) * cosDec;
    if (Math.abs(num / den) > 1) return NaN;
    return toDeg(Math.acos(num / den)) / 15;
  }

  function asrHA(shadow) {
    const a = Math.atan(1 / (shadow + Math.tan(Math.abs(toRad(lat) - Math.asin(sinDec)))));
    const n = Math.sin(a) - Math.sin(toRad(lat)) * sinDec;
    const dd = Math.cos(toRad(lat)) * cosDec;
    if (Math.abs(n / dd) > 1) return NaN;
    return toDeg(Math.acos(n / dd)) / 15;
  }

  // Isha: if method.isha >= 60 it's a fixed offset in minutes from Maghrib
  const ishaIsOffset = method.isha >= 60;
  const maghribDecimal = transit + ha(-0.833);

  return {
    fajr:    transit - ha(-method.fajr),
    sunrise: transit - ha(-0.833),
    dhuhr:   transit + 0.055,
    asr:     transit + asrHA(asr.factor),
    maghrib: maghribDecimal,
    isha:    ishaIsOffset ? maghribDecimal + method.isha / 60 : transit + ha(-method.isha),
  };
}

// ──────────────────────────────────────────────
function decimalToHHMM(h) {
  if (isNaN(h)) return '--:--';
  h = ((h % 24) + 24) % 24;
  const hh = Math.floor(h);
  const mm = Math.floor((h - hh) * 60);
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

function decimalToDate(h, referenceDate) {
  if (isNaN(h)) return null;
  h = ((h % 24) + 24) % 24;
  const hh = Math.floor(h);
  const mm = Math.floor((h - hh) * 60);
  const ss = Math.floor(((h - hh) * 60 - mm) * 60);
  return new Date(referenceDate.getFullYear(), referenceDate.getMonth(), referenceDate.getDate(), hh, mm, ss);
}

function applyAdj(decimalHour, minutesAdj) {
  return decimalHour + minutesAdj / 60;
}

function updateMainPage() {

  // Info bar

  if (methodEl) methodEl.textContent = (METHODS[settings.method] || METHODS.Karachi).name.split(' (')[0];

  updateNextBanner(settings, city, now);
  renderDualLists(settings, city, now);

  // Countdown
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => tickCountdown(settings, city), 1000);

}

function getTimesForDate(date, settings, city) {
  const raw = calcPrayerTimes(date, city.lat, city.lon, settings.method, settings.asrMethod);
  const adj = settings.adjustments;
  return {
    fajr:    applyAdj(raw.fajr,    adj.fajr    || 0),
    sunrise: raw.sunrise,
    dhuhr:   applyAdj(raw.dhuhr,   adj.dhuhr   || 0),
    asr:     applyAdj(raw.asr,     adj.asr     || 0),
    maghrib: applyAdj(raw.maghrib, adj.maghrib || 0),
    isha:    applyAdj(raw.isha,    adj.isha    || 0),
  };
}

function updateNextBanner(settings, city, now) {
  const times = getTimesForDate(now, settings, city);
  const nowDecimal = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;

  let nextPrayer = null, nextTime = null;
  for (const p of PRAYERS) {
    const ph = ((times[p.key] % 24) + 24) % 24;
    if (nowDecimal < ph) { nextPrayer = p; nextTime = decimalToDate(times[p.key], now); break; }
  }

  if (!nextPrayer) {
    const tom = new Date(now); tom.setDate(tom.getDate() + 1);
    const tomTimes = getTimesForDate(tom, settings, city);
    nextPrayer = PRAYERS[0];
    nextTime = decimalToDate(tomTimes.fajr, tom);
  }

  const iconEl  = document.getElementById('nextIcon');
  const nameEl  = document.getElementById('nextName');
  if (iconEl) iconEl.textContent = nextPrayer.icon;
  if (nameEl) nameEl.textContent = nextPrayer.nameUz;

  // Store for countdown
  window._nextPrayerTime = nextTime;
}

function tickCountdown(settings, city) {
  const now = new Date();
  if (!window._nextPrayerTime) { updateNextBanner(settings, city, now); return; }

  let diff = Math.max(0, window._nextPrayerTime - now);
  if (diff === 0) { setTimeout(() => { updateMainPage(); }, 1500); return; }

  const h  = Math.floor(diff / 3600000); diff -= h * 3600000;
  const m  = Math.floor(diff / 60000);   diff -= m * 60000;
  const s  = Math.floor(diff / 1000);

  const el = document.getElementById('countdown');
  if (el) el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderDualLists(settings, city, now) {
  const days   = ['Yak','Du','Se','Cho','Pay','Ju','Sha'];
  const months = ['Yan','Fev','Mar','Apr','May','Iyu','Iyu','Avg','Sen','Okt','Noy','Dek'];

  const tom = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);

  const todayDateEl = document.getElementById('todayDate');
  const tomDateEl   = document.getElementById('tomorrowDate');
  if (todayDateEl) todayDateEl.textContent = `${now.getDate()} ${months[now.getMonth()]}`;
  if (tomDateEl)   tomDateEl.textContent   = `${tom.getDate()} ${months[tom.getMonth()]}`;

  buildPrayerList('todayList',    settings, city, now,  false);
  buildPrayerList('tomorrowList', settings, city, tom,  true);
}

function buildPrayerList(listId, settings, city, refDate, isTomorrow) {
  const now    = new Date();
  const times  = getTimesForDate(refDate, settings, city);
  const adj    = settings.adjustments;

  // Find currently active prayer (today only) — decimal hours comparison
  let currentKey = null;
  if (!isTomorrow) {
    const nowDecimal = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
    for (let i = PRAYERS.length - 1; i >= 0; i--) {
      const ph = ((times[PRAYERS[i].key] % 24) + 24) % 24;
      if (nowDecimal >= ph) { currentKey = PRAYERS[i].key; break; }
    }
  }

  const list = document.getElementById(listId);
  if (!list) return;
  list.innerHTML = '';

  PRAYERS.forEach((p, i) => {
    const adjMin   = adj[p.key] || 0;
    const timeDate = decimalToDate(times[p.key], refDate);
    const isActive = !isTomorrow && p.key === currentKey;
    const isPassed = !isTomorrow && !isActive && timeDate && timeDate < now;

    const card = document.createElement('div');
    card.className = `prayer-card compact${isActive ? ' active' : ''}${isPassed ? ' passed' : ''}`;
    card.style.setProperty('--delay', `${0.1 + i * 0.07}s`);

    const adjLabel = adjMin !== 0
      ? `<span class="p-adj">${adjMin > 0 ? '+' : ''}${adjMin}′</span>`
      : '';

    card.innerHTML = `
      <span class="p-icon-sm">${p.icon}</span>
      <span class="p-name-sm">${p.nameUz}</span>
      <span class="p-time-sm">${decimalToHHMM(times[p.key])}${adjLabel}</span>
    `;
    list.appendChild(card);

    // Sunrise divider after fajr
    if (p.key === 'fajr') {
      const row = document.createElement('div');
      row.className = 'sunrise-row-sm';
      row.innerHTML = `🌅 ${decimalToHHMM(times.sunrise)}`;
      list.appendChild(row);
    }
  });
}

function renderSettingsPage() {

  const mosqueInput = document.getElementById('mosqueInput');

      opt.selected = key === settings.city;
      citySelect.appendChild(opt);
    });
  }

  // Populate calculation method
  const methodSelect = document.getElementById('methodSelect');
  if (methodSelect) {
    Object.entries(METHODS).forEach(([key, val]) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = val.name;
      opt.selected = key === settings.method;
      methodSelect.appendChild(opt);
    });
  }

  // Populate asr method
  const asrSelect = document.getElementById('asrSelect');
  if (asrSelect) {
    Object.entries(ASR_METHODS).forEach(([key, val]) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = val.name;
      opt.selected = key === settings.asrMethod;
      asrSelect.appendChild(opt);
    });
  }

  // Adjustment controls
  PRAYERS.forEach(p => {
    const valEl = document.getElementById(`adj_val_${p.key}`);
    if (valEl) valEl.textContent = `${settings.adjustments[p.key] >= 0 ? '+' : ''}${settings.adjustments[p.key]} daq`;

    const plusBtn  = document.getElementById(`adj_plus_${p.key}`);
    const minusBtn = document.getElementById(`adj_minus_${p.key}`);

    function updateAdj(delta) {
      const s = loadSettings();
      s.adjustments[p.key] = Math.max(-30, Math.min(30, (s.adjustments[p.key] || 0) + delta));
      saveSettings(s);
      const el = document.getElementById(`adj_val_${p.key}`);
      if (el) el.textContent = `${s.adjustments[p.key] >= 0 ? '+' : ''}${s.adjustments[p.key]} daq`;
    }

    if (plusBtn)  plusBtn.addEventListener('click',  () => updateAdj(+1));
    if (minusBtn) minusBtn.addEventListener('click', () => updateAdj(-1));
  });

  // Save button
  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const s = loadSettings();
      s.city        = document.getElementById('citySelect').value;
      s.method      = document.getElementById('methodSelect').value;
      s.asrMethod   = document.getElementById('asrSelect').value;
      s.mosqueName  = (document.getElementById('mosqueInput')?.value || '').trim();
      s.mosqueArabic = (document.getElementById('mosqueArabicInput')?.value || '').trim();
      saveSettings(s);
      showToast('Sozlamalar saqlandi ✓');
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    });
  }
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Hijriy sana hisoblash
function toHijri(date, adj){
  adj = adj || 0;
  const HIJRI_MONTHS=['Muharram','Safar','Rabi ul-Avval','Rabi ul-Oxir',
    'Jumad ul-Avval','Jumad ul-Oxir','Rajab','Sha\'bon','Ramazon','Shavvol',
    'Zul-Qa\'da','Zul-Hijja'];
  const d2=new Date(date); d2.setDate(d2.getDate()+adj);
  const y=d2.getFullYear(),m=d2.getMonth()+1,d=d2.getDate();
  const a=Math.floor((14-m)/12);
  const yr=y+4800-a, mo=m+12*a-3;
  let jdn=d+Math.floor((153*mo+2)/5)+365*yr+Math.floor(yr/4)-Math.floor(yr/100)+Math.floor(yr/400)-32045;
  const l=jdn-1948440+10632;
  const n=Math.floor((l-1)/10631);
  const l2=l-10631*n+354;
  const j=Math.floor((10985-l2)/5316)*Math.floor((50*l2)/17719)+Math.floor(l2/5670)*Math.floor((43*l2)/15238);
  const l3=l2-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;
  const hm=Math.floor((24*l3)/709);
  const hd=l3-Math.floor((709*hm)/24);
  const hy=30*n+j-30;
  return { d:hd, m:hm, y:hy, mName:HIJRI_MONTHS[hm-1] };
}

// ── Oy fazasi SVG
function drawMoonPhase(day){
  const svg = document.getElementById('moonSvg2');
  if(!svg) return;
  const R = 34, cx = 40, cy = 40;
  const gold = '#c9a84c', dark = '#0a0f1e', glow = 'rgba(201,168,76,0.35)';

  const waxing = day <= 15;
  // illumination: 0=yangi oy, 1=to'liq oy
  const illum = day <= 15 ? (day - 1) / 14 : (30 - day) / 14;
  // limb fraction: +1=yangi(crescent thin), 0=yarim, -1=to'liq
  const limbFrac = Math.cos(Math.PI * illum);
  const ex = Math.abs(limbFrac) * R; // ellips x radiusi

  const top = {x: cx, y: cy - R};
  const bot = {x: cx, y: cy + R};

  let path = '';

  if(day <= 1 || day >= 30){
    // Yangi oy — juda ingichka o'ng o'roq
    path = `<path d="M${cx},${cy-R} A${R},${R} 0 1,1 ${cx},${cy+R} A${R*0.1},${R} 0 1,0 ${cx},${cy-R}" fill="${gold}" opacity="0.9"/>`;
  } else if(illum >= 0.99){
    // To'liq oy
    path = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${gold}" opacity="0.95"/>`;
  } else {
    // Umumiy: har doim o'ng yoni (waxing) yoki chap yoni (waning) lit
    // Tashqi yoy: yoritilgan yonning yarim doirasi
    // Ichki yoy (terminator): crescent=konkav, gibbous=konveks

    let outerSweep, innerSweep;
    let innerEx;

    if(waxing){
      // O'ng yoni yoritilgan
      outerSweep = 1; // o'ng yarim doira (soat yo'nalishi yuqoridan pastga)
      if(limbFrac > 0){
        // Crescent: terminator chap tomonga botgan (konkav)
        innerSweep = 0; innerEx = ex;
      } else {
        // Gibbous: terminator o'ng tomonga chiqqan (konveks)
        innerSweep = 1; innerEx = ex;
      }
    } else {
      // Chap yoni yoritilgan
      outerSweep = 0; // chap yarim doira (soat teskari)
      if(limbFrac > 0){
        // Crescent: terminator o'ng tomonga botgan
        innerSweep = 1; innerEx = ex;
      } else {
        // Gibbous: terminator chap tomonga chiqqan
        innerSweep = 0; innerEx = ex;
      }
    }

    let innerArc;
    if(innerEx < 1){
      innerArc = `L${bot.x},${bot.y}`;
    } else {
      innerArc = `A${innerEx},${R} 0 0,${innerSweep} ${bot.x},${bot.y}`;
    }
    path = `<path d="M${top.x},${top.y} A${R},${R} 0 1,${outerSweep} ${bot.x},${bot.y} ${innerArc} Z" fill="${gold}" opacity="0.92"/>`;
  }

  const glowCircle = `<circle cx="${cx}" cy="${cy}" r="${R+4}" fill="none" stroke="${glow}" stroke-width="2.5"/>`;
  const bg = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${dark}"/>`;
  const dayTxt = `<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-weight="600">${day}</text>`;
  svg.innerHTML = glowCircle + bg + path + dayTxt;
}

function getTimes(date,settings,city){
  const raw=calcPrayerTimes(date,city.lat,city.lon,settings.method,settings.asrMethod);
  const adj=settings.adjustments;
  return{
    fajr:   applyAdj(raw.fajr,   adj.fajr   ||0),
    sunrise:raw.sunrise,
    dhuhr:  applyAdj(raw.dhuhr,  adj.dhuhr  ||0),
    asr:    applyAdj(raw.asr,    adj.asr    ||0),
    maghrib:applyAdj(raw.maghrib,adj.maghrib||0),
    isha:   applyAdj(raw.isha,   adj.isha   ||0),
  };
}

function buildCards(containerId,times,refDate,now,isToday){
  const c=document.getElementById(containerId);
  if(!c)return;c.innerHTML='';

  const nowDec  = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
  const sunH    = ((times.sunrise%24)+24)%24;
  const dhuhrH  = ((times.dhuhr%24)+24)%24;
  const isZuho  = isToday && nowDec >= sunH + 15/60 && nowDec < dhuhrH;

  let currentKey=null, nextKey=null;
  if(isToday){
    if(isZuho){
      // Zuho vaqtida: hech qaysi namoz "hozirgi" emas, peshin "keyingi"
      currentKey = null;
      nextKey = 'dhuhr';
    } else {
      for(let i=PRAYERS_TV.length-1;i>=0;i--){
        const ph=((times[PRAYERS_TV[i].key]%24)+24)%24;
        if(nowDec >= ph){currentKey=PRAYERS_TV[i].key;break;}
      }
    }
  }

  PRAYERS_TV.forEach((p,i)=>{
    const adj=(loadSettings().adjustments[p.key]||0);
    const ph=((times[p.key]%24)+24)%24;
    const isActive=isToday&&p.key===currentKey;
    const isNext  =isToday&&p.key===nextKey;
    const isPassed=isToday&&!isActive&&!isNext&&nowDec>ph;

    const card=document.createElement('div');
    card.className=`pcard${isActive?' active':''}${isNext?' next-prayer':''}${isPassed?' passed':''}`;
    card.style.setProperty('--dl',`${0.15+i*.1}s`);

    const adjHtml=adj!==0?`<div class="c-adj">${adj>0?'+':''}${adj} daq</div>`:'';
    const ribbon = isActive
      ? '<div class="active-ribbon">✦ HOZIRGI NAMOZ ✦</div>'
      : isNext
        ? '<div class="active-ribbon next-ribbon">⟩ KEYINGI NAMOZ ⟨</div>'
        : '';
    card.innerHTML=`
      ${ribbon}
      <div class="c-icon">${p.icon}</div>
      <div class="c-ar">${p.nameAr}</div>
      <div class="c-uz">${p.nameUz}</div>
      <div class="c-time">${decimalToHHMM(times[p.key])}</div>
      ${adjHtml}
    `;
    c.appendChild(card);
  });
}

function renderTV(){
  const settings=loadSettings();
  const city=CITIES[settings.city]||CITIES.Tashkent;
  const now=new Date();
  const tom=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);

  document.getElementById('mosqueName').textContent   =settings.mosqueName   ||'Namoz Vaqtlari';
  document.getElementById('mosqueArabic').textContent =settings.mosqueArabic ||'بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم';
  document.getElementById('cityFooter').textContent   =city.name;
  document.getElementById('methodFooter').textContent =(METHODS[settings.method]||METHODS.Karachi).name;
  document.getElementById('todayDate').textContent    =`${DAYS_UZ[now.getDay()]}, ${now.getDate()} ${MONTHS_UZ[now.getMonth()]}`;
  document.getElementById('tomorrowDate').textContent =`${DAYS_UZ[tom.getDay()]}, ${tom.getDate()} ${MONTHS_UZ[tom.getMonth()]}`;

  const todayT  =getTimes(now,settings,city);
  const tomorrowT=getTimes(tom,settings,city);

  document.getElementById('todaySun').innerHTML   =`🌅 <span>Quyosh:</span> ${decimalToHHMM(todayT.sunrise)}`;
  document.getElementById('tomorrowSun').innerHTML=`🌅 <span>Quyosh:</span> ${decimalToHHMM(tomorrowT.sunrise)}`;

  // Next prayer — decimal hours comparison
  const nowDec = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
  let nextP=null, nextTime=null;
  for(const p of PRAYERS_TV){
    const ph = ((todayT[p.key]%24)+24)%24;
    if(nowDec < ph){ nextP=p; nextTime=decimalToDate(todayT[p.key],now); break; }
  }
  if(!nextP){
    nextP=PRAYERS_TV[0];
    nextTime=decimalToDate(tomorrowT.fajr,tom);
  }
  window._tvNextTime=nextTime;
  document.getElementById('nextName').textContent=`${nextP.icon} ${nextP.nameUz}`;

  buildCards('todayCards',   todayT,   now,now,true);
  buildCards('tomorrowCards',tomorrowT,tom,now,false);
}

function tickCountdown(){
  if(!window._tvNextTime)return;
  let diff=Math.max(0,window._tvNextTime-new Date());
  const h=Math.floor(diff/3600000);diff-=h*3600000;
  const m=Math.floor(diff/60000);diff-=m*60000;
  const s=Math.floor(diff/1000);
  document.getElementById('nextCountdown').textContent=
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(h===0&&m===0&&s===0)setTimeout(renderTV,1500);
}

// ── DRAW CIRCLE CLOCK ────────────────────────
function drawCircle(){
  const canvas = document.getElementById('clockCanvas');
  if(!canvas) return;
  const ctx  = canvas.getContext('2d');
  const cx   = 290, cy = 290, R = 266, r = 176;
  const now  = new Date();
  const settings = loadSettings();
  const city = CITIES[settings.city]||CITIES.Tashkent;
  const times = getTimes(now, settings, city);

  ctx.clearRect(0,0,580,580);

  // Convert decimal hour to angle (0h = top = -90deg, clockwise)
  // 24 hours = 360 degrees
  function hToAngle(h){ return (h/24)*Math.PI*2 - Math.PI/2; }

  // Prayer segments: [from_h, to_h, color, key]
  const fajrH    = ((times.fajr   %24)+24)%24;
  const sunriseH = ((times.sunrise%24)+24)%24;
  const dhuhrH   = ((times.dhuhr  %24)+24)%24;
  const asrH     = ((times.asr    %24)+24)%24;
  const maghribH = ((times.maghrib%24)+24)%24;
  const ishaH    = ((times.isha   %24)+24)%24;

  // Makruh (forbidden) times
  const M15 = 15/60; // 15 minutes in decimal hours
  const M5  =  5/60; //  5 minutes in decimal hours
  const makruh1End   = sunriseH + M15;  // sunrise + 15 min
  const makruh2Start = dhuhrH   - M15;  // zaval: dhuhr - 15 min
  const makruh3Start = maghribH - M5;   // sunset - 5 min

  const segments = [
    { from:0,              to:fajrH,         color:'#0d1428', key:'night1'  },
    { from:fajrH,          to:sunriseH,      color:'#6b3fa0', key:'fajr'    },
    // makruh 1: sunrise → sunrise+15min
    { from:sunriseH,       to:makruh1End,    color:'#c0392b', key:'makruh1' },
    // zuho: sunrise+15min → dhuhr-15min
    { from:makruh1End,     to:makruh2Start,  color:'#e8d5a0', key:'zuho'   },
    // makruh 2: zaval — dhuhr-15min → dhuhr
    { from:makruh2Start,   to:dhuhrH,        color:'#c0392b', key:'makruh2' },
    { from:dhuhrH,         to:asrH,          color:'#b8922a', key:'dhuhr'   },
    { from:asrH,           to:makruh3Start,  color:'#2878a8', key:'asr'     },
    // makruh 3: sunset-5min → maghrib
    { from:makruh3Start,   to:maghribH,      color:'#c0392b', key:'makruh3' },
    { from:maghribH,       to:ishaH,         color:'#1a7a4a', key:'maghrib' },
    { from:ishaH,          to:24,            color:'#1a3060', key:'isha'    },
  ];

  // Find active segment key for explode effect (including makruh zones)
  const nowDecimal = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
  let activeSegKey = null;

  // Check makruh zones first (they take priority)
  if(nowDecimal >= sunriseH && nowDecimal < makruh1End){
    activeSegKey = 'makruh1';
  } else if(nowDecimal >= makruh2Start && nowDecimal < dhuhrH){
    activeSegKey = 'makruh2';
  } else if(nowDecimal >= makruh3Start && nowDecimal < maghribH){
    activeSegKey = 'makruh3';
  } else {
    // Regular prayer segments
    const prayerOrder = ['fajr','zuho','dhuhr','asr','maghrib','isha'];
    for(let i=prayerOrder.length-1;i>=0;i--){
      const key = prayerOrder[i];
      let ph;
      if(key==='zuho') ph = makruh1End;
      else ph = ((times[key]%24)+24)%24;
      if(nowDecimal >= ph){ activeSegKey = key; break; }
    }
  }

  const EXPLODE = 22; // px offset for active segment

  // Draw segments
  segments.forEach(seg=>{
    const aStart = hToAngle(seg.from);
    const aEnd   = hToAngle(seg.to);
    const aMid   = (aStart + aEnd) / 2;

    const isActive = seg.key === activeSegKey;
    // Offset the whole segment (center + arc) outward
    const ox = isActive ? Math.cos(aMid) * EXPLODE : 0;
    const oy = isActive ? Math.sin(aMid) * EXPLODE : 0;

    ctx.beginPath();
    ctx.moveTo(cx + ox, cy + oy);
    ctx.arc(cx + ox, cy + oy, R, aStart, aEnd);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();

    // Active segment: bright white border
    if(isActive){
      ctx.beginPath();
      ctx.moveTo(cx + ox, cy + oy);
      ctx.arc(cx + ox, cy + oy, R, aStart, aEnd);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  });

  // Draw hatch overlay on makruh segments for extra clarity
  const makruhSegs = segments.filter(s=>s.key.startsWith('makruh'));
  makruhSegs.forEach(seg=>{
    const aStart = hToAngle(seg.from);
    const aEnd   = hToAngle(seg.to);
    ctx.save();
    // Clip to this segment
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,aStart,aEnd);
    ctx.closePath();
    ctx.clip();
    // Draw diagonal lines
    ctx.strokeStyle='rgba(255,255,255,0.18)';
    ctx.lineWidth=2;
    for(let i=-R*2;i<R*2;i+=10){
      ctx.beginPath();
      ctx.moveTo(cx+i, cy-R);
      ctx.lineTo(cx+i+R, cy+R);
      ctx.stroke();
    }
    ctx.restore();
  });
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#04080f';
  ctx.fill();

  // Outer ring border
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(201,168,76,0.3)';
  ctx.lineWidth=2;
  ctx.stroke();

  // Inner ring border
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(201,168,76,0.2)';
  ctx.lineWidth=1.5;
  ctx.stroke();

  // Hour tick marks only (no labels)
  for(let h=0;h<24;h++){
    const a = hToAngle(h);
    const isMajor = h%6===0;
    const r1 = isMajor ? R-8 : R-5;
    const r2 = R+2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
    ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2);
    ctx.strokeStyle = isMajor ? 'rgba(201,168,76,0.8)' : 'rgba(201,168,76,0.25)';
    ctx.lineWidth   = isMajor ? 2 : 1;
    ctx.stroke();
  }


  // Prayer name markers on the ring
  const pMarkers = [
    {h:fajrH,   lbl:'Bomdod',  ar:'الفجر',  col:'#9b6fd0'},
    {h:dhuhrH,  lbl:'Peshin',  ar:'الظهر',  col:'#d4a840'},
    {h:asrH,    lbl:'Asr',     ar:'العصر',  col:'#4a9eca'},
    {h:maghribH,lbl:'Shom',    ar:'المغرب', col:'#e06060'},
    {h:ishaH,   lbl:'Xufton',  ar:'العشاء', col:'#4070b8'},
  ];

  pMarkers.forEach(pm=>{
    const a   = hToAngle(pm.h);
    const rmid= (r+R)/2;
    ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*rmid, cy+Math.sin(a)*rmid, 7,0,Math.PI*2);
    ctx.fillStyle=pm.col;
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });

  // ── Mustahab (afzal) vaqt markers
  const bomdodMid  = (fajrH + sunriseH) / 2;
  const peshinMid  = (dhuhrH + asrH) / 2;
  const asrMid     = (asrH + maghribH) / 2 - 15/60;
  const shomStart  = maghribH;
  const xuftonDur  = (ishaH < fajrH ? fajrH + 24 : fajrH + 24) - ishaH;
  const xufton3    = ishaH + xuftonDur * 2/3;

  const mustahab = [
    { h: bomdodMid, col1:'#c9a0f0', col2:'#f0e0ff' }, // Bomdod — binafsha yorqin
    { h: peshinMid, col1:'#f0d060', col2:'#fff8c0' }, // Peshin — oltin yorqin
    { h: asrMid,    col1:'#60c0f0', col2:'#d0f0ff' }, // Asr    — ko'k yorqin
    { h: shomStart, col1:'#60e0a0', col2:'#c0fff0' }, // Shom   — yashil yorqin
    { h: xufton3,   col1:'#6080e0', col2:'#c0d0ff' }, // Xufton — ko'k-binafsha
  ];

  mustahab.forEach(m=>{
    const a    = hToAngle(((m.h%24)+24)%24);
    const rmid = (r+R)/2;
    const mx   = cx + Math.cos(a)*rmid;
    const my   = cy + Math.sin(a)*rmid;

    // Outer glow ring
    ctx.beginPath();
    ctx.arc(mx, my, 14, 0, Math.PI*2);
    ctx.strokeStyle = m.col1;
    ctx.lineWidth   = 1.5;
    ctx.globalAlpha = 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Gradient filled dot
    const grad = ctx.createRadialGradient(mx-2, my-2, 1, mx, my, 10);
    grad.addColorStop(0, m.col2);
    grad.addColorStop(1, m.col1);
    ctx.beginPath();
    ctx.arc(mx, my, 10, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.shadowColor = m.col1;
    ctx.shadowBlur  = 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    // White border
    ctx.beginPath();
    ctx.arc(mx, my, 10, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    // Star ✦ inside
    ctx.font = 'bold 10px sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✦', mx, my);
  });

  // Current time needle
  const nowH = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
  const nowA  = hToAngle(nowH);

  // Needle line
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(nowA)*r, cy + Math.sin(nowA)*r);
  ctx.lineTo(cx + Math.cos(nowA)*R, cy + Math.sin(nowA)*R);
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=3;
  ctx.shadowColor='rgba(255,255,255,0.8)';
  ctx.shadowBlur=12;
  ctx.stroke();
  ctx.shadowBlur=0;

  // Needle head dot
  ctx.beginPath();
  ctx.arc(cx+Math.cos(nowA)*R, cy+Math.sin(nowA)*R, 8,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(255,255,255,0.9)';
  ctx.shadowBlur=14;
  ctx.fill();
  ctx.shadowBlur=0;

  // Center dot
  ctx.beginPath();
  ctx.arc(cx,cy,10,0,Math.PI*2);
  ctx.fillStyle='rgba(201,168,76,0.8)';
  ctx.shadowColor='rgba(201,168,76,0.8)';ctx.shadowBlur=10;
  ctx.fill();ctx.shadowBlur=0;

  // ── Update center text using activeSegKey (already computed above)
  document.getElementById('ccTime').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const CENTER_LABELS = {
    fajr:    { nameUz:'Bomdod',  nameAr:'الفجر'  },
    zuho:    { nameUz:'Zuho',    nameAr:'الضحى'  },
    dhuhr:   { nameUz:'Peshin',  nameAr:'الظهر'  },
    asr:     { nameUz:'Asr',     nameAr:'العصر'  },
    maghrib: { nameUz:'Shom',    nameAr:'المغرب' },
    isha:    { nameUz:'Xufton',  nameAr:'العشاء' },
    makruh1: { nameUz:'Makruh vaqt', nameAr:'وقت مكروه'  },
    makruh2: { nameUz:'Makruh vaqt', nameAr:'وقت الزوال' },
    makruh3: { nameUz:'Makruh vaqt', nameAr:'وقت مكروه'  },
    night1:  { nameUz:'Tun',     nameAr:'الليل'  },
  };
  const lbl = CENTER_LABELS[activeSegKey] || { nameUz:'—', nameAr:'' };
  document.getElementById('ccName').textContent = lbl.nameUz;
  document.getElementById('ccAr').textContent   = lbl.nameAr;

  // ── Legend: update active class only
  const curKey = ['fajr','dhuhr','asr','maghrib','isha','zuho'].includes(activeSegKey) ? activeSegKey : null;
  updateLegendActive(curKey);
}

function buildLegend(){
  const leg = document.getElementById('circleLegend');
  if(!leg || leg.children.length>0) return; // already built
  const settings = loadSettings();
  const city = CITIES[settings.city]||CITIES.Tashkent;
  const now  = new Date();
  const times = getTimes(now, settings, city);

  // Zuho start/end
  const sunriseH   = ((times.sunrise%24)+24)%24;
  const dhuhrH     = ((times.dhuhr  %24)+24)%24;
  const zuhoStart  = sunriseH + 15/60;
  const zuhoEnd    = dhuhrH   - 15/60;

  LEG_DATA.forEach((ld,i)=>{
    const div = document.createElement('div');
    div.className = 'legend-item' + (ld.key==='zuho' ? ' zuho-item' : '');
    div.id = `leg_${ld.key}`;
    div.style.setProperty('--dl', `${i*.08}s`);

    // Zuho: show time range
    let timeHtml;
    if(ld.key==='zuho'){
      timeHtml = `<div class="leg-time" id="leg_time_zuho" style="font-size:1.1rem;line-height:1.3">${decimalToHHMM(zuhoStart)}<br><span style="font-size:.75rem;opacity:.6">—</span><br>${decimalToHHMM(zuhoEnd)}</div>`;
    } else {
      timeHtml = `<div class="leg-time" id="leg_time_${ld.key}">${decimalToHHMM(times[ld.key])}</div>`;
    }

    div.innerHTML = `
      <div class="leg-dot" style="background:${ld.color};--dc:${ld.color}"></div>
      <div class="leg-info">
        <div class="leg-name">${ld.nameUz}</div>
        <div class="leg-ar">${ld.nameAr}</div>
      </div>
      ${timeHtml}
    `;
    leg.appendChild(div);
  });

  // Makruh note
  const note = document.createElement('div');
  note.style.cssText='display:flex;align-items:center;gap:12px;padding:8px 14px;margin-top:4px;border-top:1px solid rgba(255,255,255,0.06)';
  note.innerHTML=`
    <div style="width:14px;height:14px;border-radius:3px;background:#c0392b;flex-shrink:0;
      background:repeating-linear-gradient(45deg,#c0392b,#c0392b 4px,#8b1a1a 4px,#8b1a1a 8px)"></div>
    <div style="font-size:0.7rem;color:#8b96a8;letter-spacing:1px;line-height:1.4">
      <span style="color:#e07070;font-weight:600">Makruh vaqtlar</span><br>
      Quyosh chiqishi +15 daq · Zaval −15 daq · Quyosh botishi −5 daq
    </div>
  `;
  leg.appendChild(note);
}

function buildDurationList(){
  const el = document.getElementById('durationList');
  if(!el || el.children.length>0) return;
  const settings = loadSettings();
  const city = CITIES[settings.city]||CITIES.Tashkent;
  const now  = new Date();
  const times = getTimes(now, settings, city);

  const sunH = ((times.sunrise%24)+24)%24;
  const dhuH = ((times.dhuhr  %24)+24)%24;
  const magH = ((times.maghrib%24)+24)%24;
  const m15  = 15/60, m5 = 5/60;

  const rows = [
    { key:'fajr',    name:'Bomdod',       color:'#6b3fa0', from:times.fajr,      to:sunH,          makruh:false },
    { key:'makruh1', name:'Makruh vaqt',  color:'#c0392b', from:sunH,            to:sunH+m15,      makruh:true  },
    { key:'zuho',    name:'Zuho',         color:'#e8d5a0', from:sunH+m15,        to:dhuH-m15,      makruh:false },
    { key:'makruh2', name:'Makruh vaqt',  color:'#c0392b', from:dhuH-m15,        to:dhuH,          makruh:true  },
    { key:'dhuhr',   name:'Peshin',       color:'#b8922a', from:times.dhuhr,     to:times.asr,     makruh:false },
    { key:'asr',     name:'Asr',          color:'#2878a8', from:times.asr,       to:magH-m5,       makruh:false },
    { key:'makruh3', name:'Makruh vaqt',  color:'#c0392b', from:magH-m5,         to:magH,          makruh:true  },
    { key:'maghrib', name:'Shom',         color:'#1a7a4a', from:times.maghrib,   to:times.isha,    makruh:false },
    { key:'isha',    name:'Xufton',       color:'#1a3060', from:times.isha,      to:times.fajr+24, makruh:false },
  ];

  // Max duration for bar scaling
  const maxMins = Math.max(...rows.map(r=> Math.round((r.to - r.from)*60)));

  const title = document.createElement('div');
  title.className = 'dur-title';
  title.textContent = 'Namoz vaqtlari davomiyligi';
  el.appendChild(title);

  rows.forEach(r=>{
    const mins = Math.round((r.to - r.from)*60);
    const pct  = Math.round(mins/maxMins*100);
    const fromH= ((r.from%24)+24)%24;
    const toH  = ((r.to  %24)+24)%24;
    const div  = document.createElement('div');
    div.className = 'dur-item' + (r.makruh?' makruh-dur':'');
    div.id = `dur_${r.key}`;
    div.innerHTML=`
      <div class="dur-dot${r.makruh?' sq':''}" style="background:${r.color}"></div>
      <div class="dur-name">${r.name}</div>
      <div class="dur-range">${decimalToHHMM(fromH)} – ${decimalToHHMM(toH)}</div>
      <div class="dur-bar-wrap"><div class="dur-bar" style="width:${pct}%;background:${r.color}"></div></div>
      <div class="dur-mins">${mins} daq</div>
    `;
    el.appendChild(div);
  });
}

function updateDurationActive(activeKey){
  document.querySelectorAll('.dur-item').forEach(el=>{
    const key = el.id.replace('dur_','');
    el.classList.toggle('active-dur', key===activeKey && !el.classList.contains('makruh-dur'));
  });
}
function updateLegendActive(curKey){
  LEG_DATA.forEach(ld=>{
    const el = document.getElementById(`leg_${ld.key}`);
    if(el) el.classList.toggle('active-leg', ld.key===curKey);
  });
}

// ── Animate circle needle every second when visible
function tickCircle(){
  if(currentPanel===1) drawCircle();
}

document.addEventListener('DOMContentLoaded',()=>{
  tickClock();
  renderTV();
  buildLegend();
  buildDurationList();
  setInterval(tickClock,     1000);
  setInterval(tickCountdown, 1000);
  setInterval(tickCircle,    1000);
  setInterval(renderTV,     60000);
  setInterval(()=>{ switchPanel((currentPanel+1)%2); }, PANEL_INTERVAL);
  tickCountdown();
});

</script>
</body>
</html>
