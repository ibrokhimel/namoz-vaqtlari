<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namoz Vaqtlari — TV</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div class="stage" id="stage">

<div class="bg"></div>
<div class="geo"></div>
<div class="stars" id="stars"></div>
<div class="bar top"></div><div class="bar bot"></div>
<div class="sline l"></div><div class="sline r"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="layout">

  <!-- TOP STRIP: mosque identity + wall clock -->
  <header class="topbar">
    <div class="mosque-block">
      <div class="mosque-arabic" id="mosqueArabic" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
      <div class="mosque-name"   id="mosqueName">Namoz Vaqtlari</div>
    </div>
    <div class="clock-block">
      <div class="live-clock" id="liveClock">--:--</div>
      <div class="live-date">
        <span id="liveDate">—</span>
        <span id="liveHijri">—</span>
      </div>
    </div>
  </header>

  <!-- PANELS -->
  <div class="panels" id="panels">

    <!-- PANEL 1: next prayer + today + tomorrow -->
    <div class="panel panel-days visible" id="panel1">

      <!-- HERO: the one thing the back row must read -->
      <section class="hero" id="hero">
        <div class="hero-label" id="heroLabel">Keyingi namoz</div>
        <div class="hero-main">
          <div class="hero-name">
            <span class="hero-uz" id="heroName">—</span>
            <span class="hero-ar" id="heroAr" lang="ar" dir="rtl"></span>
          </div>
          <div class="hero-time" id="heroTime">--:--</div>
        </div>
        <div class="hero-progress"><div class="hero-progress-fill" id="heroProgress"></div></div>
        <div class="hero-countdown" id="heroCountdown">—</div>
      </section>

      <!-- TODAY -->
      <section class="today-row" id="todayRow" aria-label="Bugungi namoz vaqtlari"></section>

      <!-- TOMORROW: one line -->
      <section class="tomorrow-line" id="tomorrowLine"></section>
    </div>

    <!-- PANEL 2: Doira diagramma -->
    <div class="panel panel-circle" id="panel2">
      <div class="moon-corner" id="moonCorner">
        <svg id="moonSvg2" width="80" height="80" viewBox="0 0 80 80"></svg>
        <div class="moon-corner-label" id="moonCornerLabel">—</div>
      </div>
      <div class="circle-wrap">
        <canvas id="clockCanvas" width="580" height="580"></canvas>
        <div class="circle-center">
          <div class="cc-time"  id="ccTime">--:--</div>
          <div class="cc-label">hozirgi vaqt</div>
          <div class="cc-name"  id="ccName">—</div>
          <div class="cc-ar"   id="ccAr">—</div>
        </div>
      </div>
      <div class="circle-legend" id="circleLegend"></div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div>
      <span id="cityFooter">Toshkent</span><span class="f-sep">·</span><span id="methodFooter">—</span><span class="f-sep">·</span><span id="asrFooter">—</span>
    </div>
    <div>Astronomik hisob<span class="f-sep">·</span><span class="f-credit">RKE</span></div>
  </footer>

</div>

</div><!-- /stage -->

<script>
// ── FIT STAGE TO SCREEN ──────────────────────
(function(){
  const stage=document.getElementById('stage');
  function fitStage(){
    const s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.setProperty('--s', s);
  }
  fitStage();
  window.addEventListener('resize', fitStage);
})();
</script>
<script src="core.js"></script>
<script src="tv.js"></script>
</body>
</html>
