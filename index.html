<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Namoz Vaqtlari</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sky background -->
<div class="sky">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
</div>
<div class="geo-line left"></div>
<div class="geo-line right"></div>

<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="header-title">
      <span class="arabic-title">أوقات الصلاة</span>
      <span class="uz-subtitle" id="mosqueDisplay">Namoz Vaqtlari</span>
    </div>
    <a href="settings.html" class="settings-btn" title="Sozlamalar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <!-- Info bar -->
  <div class="info-bar">
    <div class="info-pill">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      <strong id="cityDisplay">Toshkent</strong>
    </div>
    <div class="info-divider"></div>
    <div class="info-pill">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8"  y1="2" x2="8"  y2="6"/>
        <line x1="3"  y1="10" x2="21" y2="10"/>
      </svg>
      <span id="dateDisplay">—</span>
    </div>
    <div class="info-divider"></div>
    <div class="info-pill">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span id="methodDisplay">—</span>
    </div>
  </div>

  <!-- Next prayer banner -->
  <div class="next-banner" id="nextBanner">
    <div class="next-left">
      <div class="next-icon" id="nextIcon">🌙</div>
      <div>
        <div class="next-label">⬤ Keyingi namoz</div>
        <div class="next-name" id="nextName">—</div>
      </div>
    </div>
    <div class="countdown-wrap">
      <div class="countdown" id="countdown">--:--:--</div>
      <div class="countdown-sub">qoldi</div>
    </div>
  </div>

  <!-- Both days side by side -->
  <div class="dual-grid">

    <div class="day-column">
      <div class="day-header today-header">
        <span class="day-dot"></span>
        Bugun
        <span class="day-date" id="todayDate">—</span>
      </div>
      <div class="prayer-list" id="todayList"></div>
    </div>

    <div class="day-column">
      <div class="day-header tomorrow-header">
        <span class="day-dot dim"></span>
        Ertaga
        <span class="day-date" id="tomorrowDate">—</span>
      </div>
      <div class="prayer-list" id="tomorrowList"></div>
    </div>

  </div>

  <footer>Barcha vaqtlar UTC+5 (Toshkent vaqti) &nbsp;·&nbsp; Taqribiy astronomik hisob</footer>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
